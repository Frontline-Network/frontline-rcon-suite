[project]
name = "frontline-crcon-callback-service"
version = "0.1.0"
description = "Authenticated callback broker for provisioned Frontline RCON installations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
