[supervisord]
logfile=/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
nodaemon=true

[program:frontline_runtime]
command=/code/manage.py combined_runtime
environment=LOGGING_FILENAME=combined_runtime_%(ENV_SERVER_NUMBER)s.log,HLL_SUPERVISOR_PROCESS=1,HLL_DB_POOL_SIZE=4,HLL_DB_MAX_OVERFLOW=2
startretries=100
startsecs=10
autostart=true
autorestart=true

[program:workers]
command=rq worker --with-scheduler -u %(ENV_HLL_REDIS_URL)s
environment=LOGGING_FILENAME=workers_%(ENV_SERVER_NUMBER)s.log,HLL_SUPERVISOR_PROCESS=1
startretries=100
startsecs=1
autostart=true

[program:cron]
environment=LOGGING_FILENAME=cron_%(ENV_SERVER_NUMBER)s.log
command=/bin/bash -c "/usr/bin/crontab /config/crontab && /usr/sbin/cron -f"

[unix_http_server]
file=/tmp/supervisor.sock

[inet_http_server]
port=0.0.0.0:9001

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
