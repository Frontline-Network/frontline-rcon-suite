name: build-docker-images-manual

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Choose a tag"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  verified-build:
    uses: ./.github/workflows/docker-images.yml
    with:
      build_tag: ${{ inputs.tag }}
      publish_stable: true
