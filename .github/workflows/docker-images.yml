name: build-docker-images

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Existing release to verify (no image builds or pushes)"
        required: true
        type: choice
        options: [v0.9.0, v0.9.1, v0.9.2]
      revision:
        description: "Exact released commit SHA"
        required: true
        type: string
      backend_digest:
        description: "Existing immutable backend sha256 digest"
        required: true
        type: string
      frontend_digest:
        description: "Existing immutable frontend sha256 digest"
        required: true
        type: string
  release:
    types: [published]
  push:
    tags:
      - "*"

concurrency:
  group: release-images-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: frontline-network/frontline-rcon-suite
  FRONTEND_IMAGE: frontline-network/frontline-rcon-suite-frontend

jobs:
  backend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bundle private release notes
        env:
          CRCON_RELEASES_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_release_notes.py
      - name: Require published v0.9.0 notes before building
        if: github.ref_name == 'v0.9.0'
        run: python3 scripts/verify_bundled_release.py v0.9.0 --require-highlights
      - name: Require reviewed hotfix notes before building
        if: contains(fromJSON('["v0.9.1", "v0.9.2"]'), github.ref_name)
        run: python3 scripts/verify_bundled_release.py "${{ github.ref_name }}"
      - name: Require inherited feature announcement before building
        if: github.ref_name == 'v0.9.2'
        run: python3 scripts/verify_bundled_release.py v0.9.0 --require-highlights
      - name: Build and push backend
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            CRCON_VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ contains(github.ref_name, 'rc') && '' || format('{0}/{1}:latest', env.REGISTRY, env.BACKEND_IMAGE) }}
  frontend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        id: build
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile-frontend
          context: .
          build-args: |
            CRCON_VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ contains(github.ref_name, 'rc') && '' || format('{0}/{1}:latest', env.REGISTRY, env.FRONTEND_IMAGE) }}

  verify-published-images:
    needs: [backend, frontend]
    # Verify the feature release and both hotfixes, including spotlight carryover.
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.backend.result == 'success' && needs.frontend.result == 'success' && contains(fromJSON('["v0.9.0", "v0.9.1", "v0.9.2"]'), github.ref_name)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
      RELEASE_REVISION: ${{ inputs.revision || github.sha }}
      BACKEND_DIGEST: ${{ inputs.backend_digest || needs.backend.outputs.digest }}
      FRONTEND_DIGEST: ${{ inputs.frontend_digest || needs.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable multi-architecture contents and latest
        run: |
          highlight_args=()
          if [ "$RELEASE_VERSION" = v0.9.0 ]; then highlight_args+=(--require-highlights); fi
          if [ "$RELEASE_VERSION" = v0.9.2 ]; then highlight_args+=(--require-history-version v0.9.0); fi
          python3 scripts/verify_release_images.py --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION" --backend-digest "$BACKEND_DIGEST" --frontend-digest "$FRONTEND_DIGEST" "${highlight_args[@]}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rcongui/package-lock.json
      - working-directory: rcongui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test final images together without a gameserver
        env:
          RELEASE_SMOKE_URL: http://127.0.0.1:8049
          RELEASE_SMOKE_BACKEND_URL: http://127.0.0.1:8048
        run: |
          docker network create release-verification
          cleanup() {
            docker logs release-backend || true
            docker logs release-frontend || true
            docker rm -fv release-backend release-frontend || true
            docker network rm release-verification || true
          }
          trap cleanup EXIT
          docker run -d --name release-backend --network release-verification --network-alias backend --platform linux/amd64 -p 127.0.0.1:8048:8000 -e RELEASE_SMOKE_TEST=1 -e RELEASE_VERSION="$RELEASE_VERSION" --entrypoint python "$REGISTRY/$BACKEND_IMAGE@$BACKEND_DIGEST" scripts/release_smoke_server.py --bind 0.0.0.0 --port 8000
          docker run -d --name release-frontend --network release-verification --platform linux/amd64 -p 127.0.0.1:8049:80 -e RCONWEB_EXTERNAL_ADDRESS=localhost "$REGISTRY/$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8049/api/is_logged_in >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8049/tag_version)" = "$RELEASE_VERSION"
          curl -fsS http://127.0.0.1:8049/updates/theme-collection.png -o "$RUNNER_TEMP/highlight.png"
          cmp assets/rcongui/updates/theme-collection.png "$RUNNER_TEMP/highlight.png"
          cd rcongui
          npx playwright test --config release-tests/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-release-verification
          path: |
            release-image-evidence.json
            rcongui/release-tests/release-test-results
