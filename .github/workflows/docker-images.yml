name: build-docker-images

on:
  workflow_call:
    inputs:
      build_tag:
        type: string
        required: true
      publish_stable:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      restore_stable_latest:
        description: "Repair only latest after the v0.9.3-rc.1 tagging incident; no rebuild"
        required: false
        default: false
        type: boolean
      release_version:
        description: "Existing release to verify (no image builds or pushes)"
        required: true
        type: string
      revision:
        description: "Exact released commit SHA"
        required: true
        type: string
      backend_digest:
        description: "Existing immutable backend sha256 digest"
        required: true
        type: string
      frontend_digest:
        description: "Existing immutable frontend sha256 digest"
        required: true
        type: string
  release:
    types: [published]
  push:
    tags:
      - "*"

concurrency:
  group: release-images-${{ inputs.build_tag || inputs.release_version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: frontline-network/frontline-rcon-suite
  FRONTEND_IMAGE: frontline-network/frontline-rcon-suite-frontend

jobs:
  restore-stable-latest:
    concurrency:
      group: stable-image-promotion
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.restore_stable_latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/restore_v092_latest.py

  source:
    if: github.event_name != 'workflow_dispatch' || inputs.build_tag != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        env:
          TAG: ${{ inputs.build_tag || github.ref_name }}
        run: |
          set -eu
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
          revision=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            test "$(git rev-parse HEAD)" = "$revision"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  backend:
    needs: source
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - name: Apply the reviewed note from the rebuild workflow revision
        if: inputs.build_tag != ''
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --worktree -- "docs/releases/$RELEASE_VERSION.md"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bundle private release notes
        env:
          CRCON_RELEASES_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_release_notes.py
      - name: Check the rebuilt snapshot against the reviewed note
        if: inputs.build_tag != ''
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: python3 scripts/verify_bundled_release.py "$RELEASE_VERSION"
      - name: Require published v0.9.0 notes before building
        if: needs.source.outputs.version == 'v0.9.0'
        run: python3 scripts/verify_bundled_release.py v0.9.0 --require-highlights
      - name: Require reviewed hotfix notes before building
        if: contains(fromJSON('["v0.9.1", "v0.9.2", "v0.9.3-rc.1", "v0.9.3", "v0.9.4-rc.1", "v0.9.4", "v0.9.10", "v0.9.11", "v0.9.12"]'), needs.source.outputs.version)
        run: python3 scripts/verify_bundled_release.py "${{ needs.source.outputs.version }}"
      - name: Require the new v0.9.4 announcement
        if: needs.source.outputs.version == 'v0.9.4'
        run: python3 scripts/verify_bundled_release.py v0.9.4 --require-highlights
      - name: Require the lightweight-runtime announcement
        if: contains(fromJSON('["v0.9.10", "v0.9.11", "v0.9.12"]'), needs.source.outputs.version)
        run: python3 scripts/verify_bundled_release.py "${{ needs.source.outputs.version }}" --require-highlights
      - name: Require inherited feature announcement before building
        if: contains(fromJSON('["v0.9.2", "v0.9.3", "v0.9.4-rc.1", "v0.9.4"]'), needs.source.outputs.version)
        run: python3 scripts/verify_bundled_release.py v0.9.0 --require-highlights
      - name: Build and push backend
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            CRCON_VERSION=${{ needs.source.outputs.version }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.revision }}
            org.opencontainers.image.version=${{ needs.source.outputs.version }}
            io.frontline.release-notes.revision=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.source.outputs.version }}
  frontend:
    needs: source
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        id: build
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile-frontend
          context: .
          build-args: |
            CRCON_VERSION=${{ needs.source.outputs.version }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.revision }}
            org.opencontainers.image.version=${{ needs.source.outputs.version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.source.outputs.version }}

  verify-published-images:
    needs: [source, backend, frontend]
    if: always() && !cancelled() && !inputs.restore_stable_latest && ((github.event_name == 'workflow_dispatch' && !inputs.build_tag) || (needs.backend.result == 'success' && needs.frontend.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ inputs.release_version || needs.source.outputs.version }}
      RELEASE_REVISION: ${{ inputs.revision || needs.source.outputs.revision }}
      BACKEND_DIGEST: ${{ inputs.backend_digest || needs.backend.outputs.digest }}
      FRONTEND_DIGEST: ${{ inputs.frontend_digest || needs.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable multi-architecture contents
        env:
          BUILT_DIGEST: ${{ needs.backend.outputs.digest }}
        run: |
          highlight_args=()
          if [[ -n "$BUILT_DIGEST" ]]; then highlight_args+=(--before-promotion); fi
          if [ "$RELEASE_VERSION" = v0.9.0 ] || [ "$RELEASE_VERSION" = v0.9.4 ] || [ "$RELEASE_VERSION" = v0.9.10 ] || [ "$RELEASE_VERSION" = v0.9.11 ] || [ "$RELEASE_VERSION" = v0.9.12 ]; then highlight_args+=(--require-highlights); fi
          if [ "$RELEASE_VERSION" = v0.9.2 ] || [ "$RELEASE_VERSION" = v0.9.3 ] || [ "$RELEASE_VERSION" = v0.9.4-rc.1 ] || [ "$RELEASE_VERSION" = v0.9.4 ]; then highlight_args+=(--require-history-version v0.9.0); fi
          python3 scripts/verify_release_images.py --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION" --backend-digest "$BACKEND_DIGEST" --frontend-digest "$FRONTEND_DIGEST" "${highlight_args[@]}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rcongui/package-lock.json
      - working-directory: rcongui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test final images together without a gameserver
        env:
          RELEASE_SMOKE_URL: http://127.0.0.1:8049
          RELEASE_SMOKE_BACKEND_URL: http://127.0.0.1:8048
          REVIEWED_REBUILD_TAG: ${{ inputs.build_tag }}
        run: |
          docker network create release-verification
          cleanup() {
            docker logs release-backend || true
            docker logs release-frontend || true
            docker rm -fv release-backend release-frontend || true
            docker network rm release-verification || true
          }
          trap cleanup EXIT
          # The slim backend intentionally excludes frontend sources. Provide
          # only the browser security fixture from the exact released commit;
          # all authentication/API requests still exercise the published images.
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$RELEASE_REVISION^{commit}" || git fetch --no-tags --depth=1 origin "$RELEASE_REVISION"
          git show "$RELEASE_REVISION:rcongui/src/utils/csrfTransport.mjs" > "$RUNNER_TEMP/csrfTransport.mjs"
          test -s "$RUNNER_TEMP/csrfTransport.mjs"
          docker run -d --name release-backend --network release-verification --network-alias backend --platform linux/amd64 -p 127.0.0.1:8048:8000 -e RELEASE_SMOKE_TEST=1 -e RELEASE_VERSION="$RELEASE_VERSION" --mount "type=bind,src=$RUNNER_TEMP/csrfTransport.mjs,dst=/code/rcongui/src/utils/csrfTransport.mjs,readonly" --entrypoint python "$REGISTRY/$BACKEND_IMAGE@$BACKEND_DIGEST" scripts/release_smoke_server.py --bind 0.0.0.0 --port 8000
          docker run -d --name release-frontend --network release-verification --platform linux/amd64 -p 127.0.0.1:8049:80 -e RCONWEB_EXTERNAL_ADDRESS=localhost "$REGISTRY/$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8049/api/is_logged_in >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8049/tag_version)" = "$RELEASE_VERSION"
          curl -fsS http://127.0.0.1:8049/updates/theme-collection.png -o "$RUNNER_TEMP/highlight.png"
          cmp assets/rcongui/updates/theme-collection.png "$RUNNER_TEMP/highlight.png"
          cd rcongui
          npx playwright test --config release-tests/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-release-verification
          path: |
            release-image-evidence.json
            rcongui/release-tests/release-test-results

  promote-stable:
    needs: [source, backend, frontend, verify-published-images]
    if: (github.event_name == 'release' && !github.event.release.prerelease || inputs.publish_stable) && !contains(needs.source.outputs.version, '-')
    runs-on: ubuntu-latest
    concurrency:
      group: stable-image-promotion
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
      FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified pair by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$current" = "$RELEASE_VERSION"
          python3 scripts/promote_release_images.py "$RELEASE_VERSION" "$BACKEND_DIGEST" "$FRONTEND_DIGEST"
