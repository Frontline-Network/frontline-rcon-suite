name: Temporary exact repository metrics
on:
  push:
    branches: [metrics/org-scan-2026-08-20]
    paths: [.github/workflows/temporary-repository-metrics.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip metrics]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Analyze exact Git history, source lines and authorship
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64,gzip
          payload=''
          exec(compile(gzip.decompress(base64.b64decode(payload)).decode(),'repository-metrics.py','exec'))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: repository-metrics-${{ github.event.repository.name }}, path: metrics-output/, retention-days: 30}
      - name: Commit report to temporary branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add metrics-output/
          git commit -m 'chore: store exact repository metrics [skip metrics] [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
