name: quality-gates

on:
  workflow_call:
  # Allow the same complete gates to run independently if a parent PR run is
  # stuck finalizing an artifact upload. No tests are omitted in this path.
  workflow_dispatch:

jobs:
  test-release-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [v0.9.0, v0.9.1, v0.9.2, v0.9.3-rc.1, v0.9.3, v0.9.4-rc.1, v0.9.4, v0.9.5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rcongui/package-lock.json
      - run: |
          pip install --no-deps -r requirements-vcs.txt --no-compile
          pip install --require-hashes --no-deps -r requirements.lock --no-compile
      - working-directory: rcongui
        env:
          REACT_APP_API_URL: /api/
          REACT_APP_VERSION: ${{ matrix.version }}
        run: |
          npm ci
          npm run copy-assets
          npm run build
          npm run check:bundle
          npx playwright install --with-deps chromium
      - name: Real authenticated backend and production frontend
        env:
          RELEASE_SMOKE_TEST: '1'
          CRCON_VERSION: ${{ matrix.version }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          history_args=()
          if [ "$RELEASE_VERSION" != v0.9.0 ]; then history_args=(--history-notes-file docs/releases/v0.9.0.md); fi
          python scripts/release_smoke_server.py --frontend rcongui/dist --notes-file "docs/releases/$RELEASE_VERSION.md" "${history_args[@]}" > "$RUNNER_TEMP/release-smoke.log" 2>&1 &
          smoke_pid=$!
          trap 'kill "$smoke_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/release-smoke.log"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8049/tag_version >/dev/null; then break; fi
            kill -0 "$smoke_pid"
            sleep 1
          done
          cd rcongui
          npx playwright test --config release-tests/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-integration-results-${{ matrix.version }}
          path: rcongui/release-tests/release-test-results

  test-discord-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install '.[test]'
      - run: python -m pytest -q

  build-admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REACT_APP_API_URL: /api/
    defaults:
      run:
        working-directory: rcongui

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rcongui/package-lock.json
      - run: npm ci
      - run: npm run check:operator-copy
      - run: npm run check:i18n
      - run: node --test src/pages/settings/broadcast-message/player-test-feedback.test.mjs
      - run: npm run check:admin-actions
      - run: npm run check:permissions
      - run: node --test ../rconweb/static/api/js/formset_handlers.test.cjs
      - run: npm run check:csrf
      - run: npm run check:game-capabilities
      - run: npm run check:polling
      - run: npm run check:log-stacks
      - run: npm run check:live-view
      - run: npm run check:player-warnings
      - run: npm run check:player-identities
      - run: node scripts/check-wardogs-colors.mjs
      - run: node --test src/components/layout/navigation/wardogs-shortcuts.test.mjs src/pages/account/password-client.test.mjs src/pages/documentation/api-reference.test.mjs src/features/updates/highlight-release.test.mjs
      - run: npm run check:live-balance
      - run: npx playwright install --with-deps chromium
      - name: run admin UI browser tests
        shell: bash
        run: |
          cleanup() {
            if [ -n "${preview_pid:-}" ]; then
              kill "$preview_pid" 2>/dev/null || true
            fi
            if [ -n "${dev_pid:-}" ]; then
              kill "$dev_pid" 2>/dev/null || true
            fi
          }
          wait_for_server() {
            local port="$1"
            local pid="$2"
            local log_file="$3"
            for attempt in {1..60}; do
              if curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null; then
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log_file"
                return 1
              fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null
          }

          preview_pid=""
          dev_pid=""
          trap cleanup EXIT
          npm run copy-assets
          npx vite build --mode fake
          npx vite preview --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/rcongui-preview.log" 2>&1 &
          preview_pid=$!
          wait_for_server 3000 "$preview_pid" "$RUNNER_TEMP/rcongui-preview.log"
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test \
            --grep-invert "filters protected destinations unless locked links are explicit"

          kill "$preview_pid" 2>/dev/null || true
          wait "$preview_pid" 2>/dev/null || true
          preview_pid=""
          npx vite dev --mode fake --host 127.0.0.1 --port 3001 > "$RUNNER_TEMP/rcongui-vite.log" 2>&1 &
          dev_pid=$!
          wait_for_server 3001 "$dev_pid" "$RUNNER_TEMP/rcongui-vite.log"
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001 npx playwright test \
            e2e/command-rail-navigation.spec.mjs \
            --grep "filters protected destinations unless locked links are explicit"
      - run: npm run test:offline
      - run: npm run build
      - run: npm run check:bundle
      - name: upload admin UI test report
        if: failure()
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-playwright-report
          path: rcongui/playwright-report
          retention-days: 7

  build-public-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rcongui_public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rcongui_public/package-lock.json
      - run: npm ci
      - run: npm run build

  test-backend:
    runs-on: ubuntu-latest

    env:
      HLL_DB_PASSWORD: rcon_dev
      HLL_DB_NAME: rcon
      HLL_DB_USER: rcon
      HLL_DB_HOST: localhost
      HLL_DB_HOST_PORT: '5432'
      HLL_REDIS_HOST: localhost
      HLL_REDIS_PORT: '6379'
      HLL_REDIS_HOST_PORT: '6379'
      HLL_REDIS_DB: '1'
      SERVER_NUMBER: '1'
      # Deliberately non-production fixture. Production has no fallback secret.
      RCONWEB_API_SECRET: ci-only-rconweb-secret-not-for-production-0001
      REDIS_IMAGE: redis:alpine
      POSTGRES_IMAGE: postgres:12-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install requirements
        run: |
          pip install --no-deps -r requirements-vcs.txt --no-compile
          pip install --require-hashes --no-deps -r requirements-dev.lock --no-compile
      - name: start dependencies
        run: docker compose -f docker-compose.dev.yml up -d postgres redis
      - name: Exercise stable promotion in a disposable registry
        run: TEST_LOCAL_RELEASE_REGISTRY=1 PYTHONPATH=. python -m unittest tests.test_release_registry
      - name: perform database migrations
        run: |
          export HLL_DB_URL=postgresql://${HLL_DB_USER}:${HLL_DB_PASSWORD}@${HLL_DB_HOST}:${HLL_DB_HOST_PORT}/${HLL_DB_NAME}
          export HLL_REDIS_URL=redis://${HLL_REDIS_HOST}:${HLL_REDIS_PORT}/${HLL_REDIS_DB}
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. python ./manage.py init_db
          PYTHONPATH=. python ./rconweb/manage.py migrate --noinput
          PYTHONPATH=. python -m django makemigrations --check --dry-run --settings=rconweb.rconweb.test_settings
      - name: run tests
        run: |
          export HLL_DB_URL=postgresql://${HLL_DB_USER}:${HLL_DB_PASSWORD}@${HLL_DB_HOST}:${HLL_DB_HOST_PORT}/${HLL_DB_NAME}
          export HLL_REDIS_URL=redis://${HLL_REDIS_HOST}:${HLL_REDIS_PORT}/${HLL_REDIS_DB}
          export LEADERSHIP_VOTE_TEST_DB_URL="$HLL_DB_URL"
          export POPULATION_TEST_DB_URL="$HLL_DB_URL"
          export VIP_REWARDS_TEST_DB_URL="$HLL_DB_URL"
          PYTHONPATH=. pytest tests/
          TEST_POSTGRES_DSN="$HLL_DB_URL" TEST_REDIS_URL="$HLL_REDIS_URL" PYTHONPATH=. \
            pytest tests/test_barricade_auto_activation_postgres.py tests/test_barricade_full_pipeline_postgres.py \
              tests/test_blacklist_sync_journal_postgres.py tests/test_blacklist_list_reconciliation_postgres.py \
              tests/test_blacklist_record_reconciliation_postgres.py tests/test_record_profile_projection.py \
              tests/test_cache_background_refresh.py
          PYTHONPATH=. python -m django test api.test_release_updates --settings=rconweb.rconweb.test_settings --verbosity=1
          PYTHONPATH=. python -m django test api.test_release_migrations --settings=rconweb.rconweb.test_settings --verbosity=1
          PYTHONPATH=. python -m django test api.test_account_password api.test_admin_theme api.test_permission_workflows api.test_api_descriptions api.test_appearance --settings=rconweb.rconweb.test_settings --verbosity=1
          PYTHONPATH=. python -m django test api.test_population --settings=rconweb.rconweb.test_settings --verbosity=1
          PYTHONPATH=. python -m django test api.test_live_view --settings=rconweb.rconweb.test_settings --verbosity=1
          PYTHONPATH=. python -m django test api.test_leadership_vote --settings=rconweb.rconweb.test_settings --verbosity=1
          PYTHONPATH=. python ./rconweb/manage.py test api.test_eventador_control --settings=rconweb.eventador_test_settings --verbosity=1
