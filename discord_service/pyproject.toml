[project]
name = "frontline-crcon-discord-service"
version = "0.1.0"
description = "Central Discord delivery and managed AI analysis for CRCON incidents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "openai>=2.23,<3",
  "cryptography>=46,<47",
  "pynacl>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
