# Worker topology contract used by scripts/deploy_frontline.sh. Combined mode
# activates only frontline_background_worker; split mode activates the three
# standalone delivery services. Never activate both worker profiles together.
services:
  mobile_push_worker:
    profiles: !reset ["split-background-workers"]

  discord_report_worker:
    profiles: !reset ["split-background-workers"]

  discord_moderation_worker:
    profiles: !reset ["split-background-workers"]
