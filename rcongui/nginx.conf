map $remote_addr $proxy_forwarded_elem {
    # IPv4 addresses can be sent as-is
    ~^[0-9.]+$          "for=$remote_addr";

    # IPv6 addresses need to be bracketed and quoted
    ~^[0-9A-Fa-f:.]+$   "for=\"[$remote_addr]\"";

    # Unix domain socket names cannot be represented in RFC 7239 syntax
    default             "for=unknown";
}

map $http_forwarded $proxy_add_forwarded {
    # If the incoming Forwarded header is syntactically valid, append to it
    "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";

    # Otherwise, replace it
    default "$proxy_forwarded_elem";
}


server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl;

        ssl_certificate /certs/cert.crt;
        ssl_certificate_key /certs/key.key;
        ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
        # SSL configuration
        #
        # listen 443 ssl default_server;
        # listen [::]:443 ssl default_server;
        #
        # Note: You should disable gzip for SSL traffic.
        # See: https://bugs.debian.org/773332
        #
        # Read up on ssl_ciphers to ensure a secure configuration.
        # See: https://bugs.debian.org/765782
        #
        # Self signed certs generated by the ssl-cert package
        # Don't use them in a production server!
        #
        # include snippets/snakeoil.conf;

        root /var/www;

        # Add index.php to the list if you are using PHP
        index index.html index.htm index.nginx-debian.html;

        server_name _;
        #auth_basic           "Admin Login";
        #auth_basic_user_file /pw/.htpasswd;

        gzip on;
        gzip_buffers 16 8k;
        gzip_comp_level 6;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css image/svg+xml application/xml text/html application/json text/javascript application/javascript;

        # Hashed build assets must never fall back to the SPA HTML document.
        # Returning a 404 lets the client recover from a stale code-split chunk.
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Never cache the SPA entry point. It contains the content-hashed
        # asset names for the current release and must update immediately.
        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires off;
            etag off;
        }

        # Older CRCON versions registered a service worker. Serve the cleanup
        # worker as JavaScript and force browsers to check it on every visit.
        location = /service-worker.js {
            try_files $uri =404;
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Service-Worker-Allowed "/" always;
            expires off;
            etag off;
        }

        # HLL Vietnam uses role identifiers for which CRCON has no dedicated
        # artwork yet. Map them to the closest existing role icon so even an
        # older cached frontend never renders a broken image.
        location ~ ^/icons/roles/(?:squadleader|helicopterlogisticsofficer)(_black)?\.png$ {
            try_files /icons/roles/officer$1.png =404;
        }
        location ~ ^/icons/roles/specialist(_black)?\.png$ {
            try_files /icons/roles/assault$1.png =404;
        }
        location ~ ^/icons/roles/grenadier(_black)?\.png$ {
            try_files /icons/roles/antitank$1.png =404;
        }
        location ~ ^/icons/roles/mortarsupport(_black)?\.png$ {
            try_files /icons/roles/support$1.png =404;
        }
        location ~ ^/icons/roles/mortarobserver(_black)?\.png$ {
            try_files /icons/roles/artilleryobserver$1.png =404;
        }
        location ~ ^/icons/roles/mortargunner(_black)?\.png$ {
            try_files /icons/roles/gunner$1.png =404;
        }
        location ~ ^/icons/roles/helicopterpilot(_black)?\.png$ {
            try_files /icons/roles/crewman$1.png =404;
        }
        location /icons/roles/ {
            try_files $uri /icons/roles/rifleman.png =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }

        # Until dedicated Vietnam map artwork is available, return the generic
        # map image instead of the SPA HTML document for missing image files.
        location ^~ /maps/icons/ {
            try_files $uri /maps/icons/unknown.webp =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }
        location ^~ /maps/ {
            try_files $uri /maps/unknown.webp =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
        }

        location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to displaying a 404.
            try_files $uri /index.html;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
            add_header Pragma 'no-cache' always;
            if_modified_since off;
            expires off;
            etag off;
        }

        location /api {
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://backend:8000/api;
        }

        location /accounts {
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://backend:8000/accounts;
        }

        location /djangostatic {
            alias /static;
            autoindex off;
        }

        # Serve media files (user uploads)
        location /media {
            alias /static/media;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /admin {
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://backend:8000/admin;
        }

        location /api/scoreboard {
            auth_basic "off";
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_pass http://backend:8000/api/scoreboard;
        }

        location /ws {
            proxy_pass http://backend:8001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-Host $server_name;
        }
}


