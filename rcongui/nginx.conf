map $remote_addr $proxy_forwarded_elem {
    # IPv4 addresses can be sent as-is
    ~^[0-9.]+$          "for=$remote_addr";

    # IPv6 addresses need to be bracketed and quoted
    ~^[0-9A-Fa-f:.]+$   "for=\"[$remote_addr]\"";

    # Unix domain socket names cannot be represented in RFC 7239 syntax
    default             "for=unknown";
}

map $http_forwarded $proxy_add_forwarded {
    # If the incoming Forwarded header is syntactically valid, append to it
    "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";

    # Otherwise, replace it
    default "$proxy_forwarded_elem";
}

# HSTS is meaningful only on HTTPS responses.  Keeping the value empty on
# port 80 also leaves HTTP-01 certificate renewal traffic unaffected.
map $https $hsts_header {
    default "max-age=31536000";
    ""      "";
}


server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl;

        # Resolve the Compose service on every cache expiry. Docker may assign
        # a new address when a backend is recreated during a rolling update.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_http backend:8000;
        set $backend_ws backend:8001;

        ssl_certificate /certs/cert.crt;
        ssl_certificate_key /certs/key.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        server_tokens off;

        # Keep this deliberately narrow: it protects browser document and
        # MIME handling without constraining CRCON's existing API, WebSocket,
        # or static asset loading paths.
        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
        # SSL configuration
        #
        # listen 443 ssl default_server;
        # listen [::]:443 ssl default_server;
        #
        # Note: You should disable gzip for SSL traffic.
        # See: https://bugs.debian.org/773332
        #
        # Read up on ssl_ciphers to ensure a secure configuration.
        # See: https://bugs.debian.org/765782
        #
        # Self signed certs generated by the ssl-cert package
        # Don't use them in a production server!
        #
        # include snippets/snakeoil.conf;

        root /var/www;

        # Add index.php to the list if you are using PHP
        index index.html index.htm index.nginx-debian.html;

        server_name _;
        #auth_basic           "Admin Login";
        #auth_basic_user_file /pw/.htpasswd;

        gzip on;
        gzip_buffers 16 8k;
        gzip_comp_level 6;
        # The managed host proxy currently speaks HTTP/1.0 to this upstream.
        # Accept that trusted proxy hop so JS, CSS and JSON are not expanded
        # again before reaching the browser.
        gzip_http_version 1.0;
        gzip_proxied any;
        gzip_vary on;
        # text/html is compressed by nginx by default and must not be repeated.
        gzip_types text/plain text/css image/svg+xml application/xml application/json text/javascript application/javascript;

        # Hashed build assets must never fall back to the SPA HTML document.
        # Returning a 404 lets the client recover from a stale code-split chunk.
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
        }

        # Never cache the SPA entry point. It contains the content-hashed
        # asset names for the current release and must update immediately.
        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
            expires off;
            etag off;
        }

        # Expose the immutable build identifier separately from the SPA shell.
        # The running UI uses it to detect a deployment and recover from stale
        # code-split chunks without requiring operators to clear browser data.
        location = /tag_version {
            try_files $uri =404;
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
            expires off;
            etag off;
        }

        # Older CRCON versions registered a service worker. Serve the cleanup
        # worker as JavaScript and force browsers to check it on every visit.
        location = /service-worker.js {
            try_files $uri =404;
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Service-Worker-Allowed "/" always;
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
            expires off;
            etag off;
        }

        # HLL Vietnam uses role identifiers for which CRCON has no dedicated
        # artwork yet. Map them to the closest existing role icon so even an
        # older cached frontend never renders a broken image.
        location ~ ^/icons/roles/(?:squadleader|helicopterlogisticsofficer)(_black)?\.png$ {
            try_files /icons/roles/officer$1.png =404;
        }
        location ~ ^/icons/roles/specialist(_black)?\.png$ {
            try_files /icons/roles/assault$1.png =404;
        }
        location ~ ^/icons/roles/grenadier(_black)?\.png$ {
            try_files /icons/roles/antitank$1.png =404;
        }
        location ~ ^/icons/roles/mortarsupport(_black)?\.png$ {
            try_files /icons/roles/support$1.png =404;
        }
        location ~ ^/icons/roles/mortarobserver(_black)?\.png$ {
            try_files /icons/roles/artilleryobserver$1.png =404;
        }
        location ~ ^/icons/roles/mortargunner(_black)?\.png$ {
            try_files /icons/roles/gunner$1.png =404;
        }
        location ~ ^/icons/roles/helicopterpilot(_black)?\.png$ {
            try_files /icons/roles/crewman$1.png =404;
        }
        location /icons/roles/ {
            try_files $uri /icons/roles/rifleman.png =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
        }

        # Until dedicated Vietnam map artwork is available, return the generic
        # map image instead of the SPA HTML document for missing image files.
        location ^~ /maps/icons/ {
            try_files $uri /maps/icons/unknown.webp =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
        }
        location ^~ /maps/ {
            try_files $uri /maps/unknown.webp =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
        }

        location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to displaying a 404.
            try_files $uri /index.html;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
            add_header Pragma 'no-cache' always;
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
            if_modified_since off;
            expires off;
            etag off;
        }

        # Barricade's Community RCON integration appends /api and
        # /ws/barricade to its configured base URL. An explicit path-scoped
        # integration ID lets both routes work without inferring a peer from
        # a bearer key that may be shared by multiple integrations.
        location /barricade-peer/ { return 404; }
        location ~ "^/barricade-peer/(?<barricade_version_peer>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/api/get_version$" {
            if ($args != "") { return 400; }
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://$backend_http/api/get_version?frontline_integration=$barricade_version_peer;
        }
        # The public CRCON peer can automatically expire entries it does not
        # recognize. Preserve those records until ownership has been reviewed.
        location ~ "^/barricade-peer/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/api/edit_blacklist_record(?:/.*)?$" {
            return 403;
        }
        location ~ "^/barricade-peer/(?<barricade_api_peer>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/api(?<barricade_api_suffix>/(?:get_public_info|get_own_user_permissions|create_blacklist|get_blacklists|get_blacklist_records|get_player_profile))$" {
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://$backend_http/api$barricade_api_suffix$is_args$args;
        }

        location ~ "^/barricade-peer/(?<barricade_ws_peer>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/ws/barricade$" {
            # Do not allow another query to override the path-bound identity.
            if ($args != "") { return 400; }
            proxy_pass http://$backend_ws/ws/barricade?frontline_integration=$barricade_ws_peer;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-Host $server_name;
        }

        location /api {
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://$backend_http$request_uri;
        }

        location /accounts {
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://$backend_http$request_uri;
        }

        location /djangostatic {
            alias /static;
            autoindex off;
        }

        # Serve media files (user uploads)
        location /media {
            alias /static/media;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public";
            add_header Strict-Transport-Security $hsts_header always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
        }

        location ~ ^/admin(?:/|$) {
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_pass http://$backend_http$request_uri;
        }

        location /api/scoreboard {
            auth_basic "off";
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_pass http://$backend_http$request_uri;
        }

        location /ws {
            proxy_pass http://$backend_ws$request_uri;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "$http_x_forwarded_for, $realip_remote_addr";
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-Host $server_name;
        }
}


server {
        listen 81;
        listen [::]:81;
        listen 444 ssl;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_http backend:8000;

        ssl_certificate /certs/cert.crt;
        ssl_certificate_key /certs/key.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        server_tokens off;

        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
