include:
  - docker-compose-common-components.yaml

networks:
  common:
  server1:

volumes:
  scoreboard_db:

# This is defined here and not in common-components because anchors don't
# work between files and are prefixed with x- because they are just anchors
# for merging later, if they're defined under services: docker will want to start them
# compose ignores any fields that start with x-
x-backend: &backend
  image: ${BACKEND_DOCKER_REPOSITORY}:${TAGGED_VERSION}
  environment: &backend-env
    LOGGING_LEVEL: "INFO"
    LOGGING_PATH: /logs/
    CONFIG_DIR: /config/
    HLL_REDIS_HOST: ${HLL_REDIS_HOST}
    HLL_REDIS_PORT: ${HLL_REDIS_HOST_PORT}
    HLL_DB_USER: ${HLL_DB_USER}
    HLL_DB_PASSWORD: ${HLL_DB_PASSWORD}
    HLL_DB_NAME: ${HLL_DB_NAME}
    HLL_DB_HOST: ${HLL_DB_HOST}
    HLL_DB_HOST_PORT: ${HLL_DB_HOST_PORT}
    HLL_DB_URL: postgresql://${HLL_DB_USER}:${HLL_DB_PASSWORD}@${HLL_DB_HOST}:${HLL_DB_HOST_PORT}/${HLL_DB_NAME}
    HLL_SUPERVISOR_CONFIG: ${HLL_SUPERVISOR_CONFIG:-}
    RATELIMIT_PROXY_DEPTH: ${RATELIMIT_PROXY_DEPTH:-1}
    RCONWEB_API_SECRET: ${RCONWEB_API_SECRET}
    MOBILE_INTEGRATION_ENABLED: ${MOBILE_INTEGRATION_ENABLED}
    MOBILE_PUBLIC_BASE_URL: ${MOBILE_PUBLIC_BASE_URL}
    DISCORD_CALLBACK_BASE_URL: ${DISCORD_CALLBACK_BASE_URL:-}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    CRCON_PASSWORD_RESET_ENABLED: ${CRCON_PASSWORD_RESET_ENABLED:-false}
    CRCON_PUBLIC_URL: ${CRCON_PUBLIC_URL:-}
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    MOBILE_INSTALLATION_ID: ${MOBILE_INSTALLATION_ID}
    MOBILE_INCIDENT_TRIGGERS: ${MOBILE_INCIDENT_TRIGGERS}
    MOBILE_INCIDENT_RETENTION_DAYS: ${MOBILE_INCIDENT_RETENTION_DAYS}
    MOBILE_CONTEXT_V2: ${MOBILE_CONTEXT_V2}
    MOBILE_CONTEXT_FUZZY_THRESHOLD: ${MOBILE_CONTEXT_FUZZY_THRESHOLD}
    MOBILE_PLAYER_OPERATIONS: ${MOBILE_PLAYER_OPERATIONS}
    MOBILE_LIVE_STATUS: ${MOBILE_LIVE_STATUS}
    MOBILE_PUSH_RELAY_URL: ${MOBILE_PUSH_RELAY_URL}
    SUPERVISOR_RPC_URL: http://supervisor:9001/RPC2
    NB_API_WORKERS: ${NB_API_WORKERS}
    NB_API_THREADS: ${NB_API_THREADS}
    RCONWEB_EXTERNAL_ADDRESS: ${RCONWEB_EXTERNAL_ADDRESS}
    DONT_SEED_ADMIN_USER: ${DONT_SEED_ADMIN_USER}
    SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
    CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN}
  command: web
  # Bound a failing instance without turning an OOM or import error into a
  # permanent restart storm. Start it explicitly again after investigating.
  restart: on-failure:5
  deploy:
    resources:
      limits:
        cpus: '${BACKEND_CPU_LIMIT:-1.0}'
        memory: ${BACKEND_MEMORY_LIMIT:-1024M}
      reservations:
        cpus: '0.10'
        memory: 256M
  healthcheck:
    test: ["CMD", "python", "/code/scripts/backend_healthcheck.py"]
    start_period: 30s
    interval: 15s
    timeout: 30s
    retries: 5
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    maintenance:
      condition: service_healthy
  volumes:
    - ./logs:/logs/
    - ./servicediscovery:/servicediscovery
    - ./static:/static/
    - ./config:/config/
x-supervisor: &supervisor
  image: ${BACKEND_DOCKER_REPOSITORY}:${TAGGED_VERSION}
  restart: on-failure:5
  command: supervisor
  deploy:
    resources:
      limits:
        cpus: '${SUPERVISOR_CPU_LIMIT:-1.5}'
        memory: ${SUPERVISOR_MEMORY_LIMIT:-2048M}
      reservations:
        cpus: '0.20'
        memory: 512M
  volumes:
    - ./logs:/logs/
    - ./supervisor_data:/data
    - ./config:/config/
    - scoreboard_db:/scoreboard_db
x-frontend: &frontend
  build:
    context: .
    dockerfile: Dockerfile-frontend
    args:
      CRCON_VERSION: ${TAGGED_VERSION:-unknown}
  image: ${FRONTEND_DOCKER_REPOSITORY}:${TAGGED_VERSION}
  environment:
    RCONWEB_EXTERNAL_ADDRESS: ${RCONWEB_EXTERNAL_ADDRESS}
  restart: always
  volumes:
    - ./static:/static/
    - ./certs:/certs/

services:
  ########### SERVER 1  #############
  backend_1:
    <<: *backend
    environment: &env_1
      <<: *backend-env
      SERVER_NUMBER: ${SERVER_NUMBER}
      CRCON_PASSWORD_RESET_ENABLED: ${CRCON_PASSWORD_RESET_ENABLED_1:-${CRCON_PASSWORD_RESET_ENABLED:-false}}
      CRCON_PUBLIC_URL: ${CRCON_PUBLIC_URL_1:-${CRCON_PUBLIC_URL:-}}
      HLL_HOST: ${HLL_HOST}
      HLL_PORT: ${HLL_PORT}
      HLL_PASSWORD: ${HLL_PASSWORD}
      HLL_GAME: ${HLL_GAME:-hll}
      FRONTLINE_VIP_REDEEM_URL: ${FRONTLINE_VIP_REDEEM_URL:-}
      FRONTLINE_VIP_STATUS_URL: ${FRONTLINE_VIP_STATUS_URL:-}
      FRONTLINE_VIP_REDEEM_SECRET: ${FRONTLINE_VIP_REDEEM_SECRET:-}
      FRONTLINE_VIP_LIFECYCLE_ENABLED: ${FRONTLINE_VIP_LIFECYCLE_ENABLED:-false}
      HLL_REDIS_DB: ${HLL_REDIS_DB}
      HLL_REDIS_URL: redis://${HLL_REDIS_HOST}:${HLL_REDIS_HOST_PORT}/${HLL_REDIS_DB}
      RCONWEB_PORT: ${RCONWEB_PORT}
      PUBLIC_STATS_PORT: ${PUBLIC_STATS_PORT}
      PUBLIC_STATS_PORT_HTTPS: ${PUBLIC_STATS_PORT_HTTPS}
      GTX_SERVER_NAME_CHANGE_USERNAME: ${GTX_SERVER_NAME_CHANGE_USERNAME}
      GTX_SERVER_NAME_CHANGE_PASSWORD: ${GTX_SERVER_NAME_CHANGE_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN}
    hostname: api_1
    networks:
      common:
      server1:
        aliases:
          - backend
  supervisor_1:
    <<: *supervisor
    environment:
      <<: *env_1
    depends_on:
      backend_1:
        condition: service_healthy
    networks:
      common:
      server1:
        aliases:
          - supervisor
  frontend_1:
    <<: *frontend
    ports:
      - ${RCONWEB_PORT}:80
      - ${RCONWEB_PORT_HTTPS}:443
      - ${PUBLIC_STATS_PORT}:81
      - ${PUBLIC_STATS_PORT_HTTPS}:444
    depends_on:
      backend_1:
        condition: service_healthy
    networks:
      common:
      server1:

  ########### SERVER 2  #############

  ########### SERVER 3  #############

  ########### SERVER 4  #############

  ########### SERVER 5  #############

  ########### SERVER 6  #############

  ########### SERVER 7  #############

  ########### SERVER 8  #############

  ########### SERVER 9  #############

  ########### SERVER 10 #############
