# Production override for the combined Frontline Autobalancer + Mobile Admin build.
# Apply together with the installation's generated compose.yaml:
#   docker compose -f compose.yaml -f compose.mobile-admin.yaml up -d

x-frontline-backend: &frontline-backend
  image: frontline/hll_rcon_tool:${CRCON_IMAGE_TAG:-mobile-admin-autobalancer-v11.11.1}
  build:
    context: .
    dockerfile: Dockerfile

x-mobile-environment: &mobile-environment
  HLL_GAME: ${HLL_GAME:-hll}
  RATELIMIT_PROXY_DEPTH: ${RATELIMIT_PROXY_DEPTH:-1}
  MOBILE_INTEGRATION_ENABLED: ${MOBILE_INTEGRATION_ENABLED:-false}
  MOBILE_PUBLIC_BASE_URL: ${MOBILE_PUBLIC_BASE_URL:-}
  DISCORD_CALLBACK_BASE_URL: ${DISCORD_CALLBACK_BASE_URL:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  MOBILE_INSTALLATION_ID: ${MOBILE_INSTALLATION_ID:-}
  MOBILE_INCIDENT_TRIGGERS: ${MOBILE_INCIDENT_TRIGGERS:-}
  MOBILE_INCIDENT_RETENTION_DAYS: ${MOBILE_INCIDENT_RETENTION_DAYS:-90}
  MOBILE_CONTEXT_V2: ${MOBILE_CONTEXT_V2:-disabled}
  MOBILE_CONTEXT_FUZZY_THRESHOLD: ${MOBILE_CONTEXT_FUZZY_THRESHOLD:-0.74}
  MOBILE_PUSH_RELAY_URL: ${MOBILE_PUSH_RELAY_URL:-}
  FRONTLINE_VIP_REDEEM_URL: ${FRONTLINE_VIP_REDEEM_URL:-}
  FRONTLINE_VIP_REDEEM_SECRET: ${FRONTLINE_VIP_REDEEM_SECRET:-}
  INCIDENT_CAPTURE_ENABLED: ${INCIDENT_CAPTURE_ENABLED:-}
  INCIDENT_TRIGGERS: ${INCIDENT_TRIGGERS:-}
  INCIDENT_CONTEXT_MODE: ${INCIDENT_CONTEXT_MODE:-}
  INCIDENT_CONTEXT_FUZZY_THRESHOLD: ${INCIDENT_CONTEXT_FUZZY_THRESHOLD:-}
  INCIDENT_RETENTION_DAYS: ${INCIDENT_RETENTION_DAYS:-}
  DISCORD_REPORTS_ENABLED: ${DISCORD_REPORTS_ENABLED:-false}
  DISCORD_SERVICE_URL: ${DISCORD_SERVICE_URL:-}
  AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-false}
  AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-gpt-5.6-luna}
  AI_PLAYER_NAME_MODEL: ${AI_PLAYER_NAME_MODEL:-gpt-5.4-nano}

x-mobile-environment-server-2: &mobile-environment-server-2
  <<: *mobile-environment
  HLL_GAME: ${HLL_GAME_2:-hll}

x-mobile-environment-server-3: &mobile-environment-server-3
  <<: *mobile-environment
  HLL_GAME: ${HLL_GAME_3:-hll}

x-mobile-environment-server-4: &mobile-environment-server-4
  <<: *mobile-environment
  HLL_GAME: ${HLL_GAME_4:-hll}

x-frontline-frontend: &frontline-frontend
  image: frontline/hll_rcon_tool_frontend:${CRCON_IMAGE_TAG:-mobile-admin-autobalancer-v11.11.1}
  build:
    context: .
    dockerfile: Dockerfile-frontend
    args:
      CRCON_VERSION: ${CRCON_VERSION:-development}

services:
  maintenance:
    <<: *frontline-backend
    environment: *mobile-environment

  webhook_service:
    <<: *frontline-backend
    environment: *mobile-environment

  mobile_push_worker:
    # The worker delivers opaque incident notifications. It must run the
    # same Frontline build as the API so payload and relay capability handling
    # stay in lockstep with the mobile endpoints.
    <<: *frontline-backend
    command: mobile_push_worker
    environment: *mobile-environment

  discord_report_worker:
    # The generated base Compose file already contains the installation's
    # database, Redis, volume and network settings on backend_1. Reuse them
    # here so the standalone worker does not fall back to localhost or miss
    # SERVER_NUMBER during Django startup.
    extends:
      file: compose.yaml
      service: backend_1
    <<: *frontline-backend
    command: discord_event_worker
    # Extending backend_1 also inherits its private-network alias "backend".
    # Clear that alias or the frontend may send HTTP requests to this worker
    # instead of the actual Django backend after a worker recreation.
    networks:
      server1:
        aliases: !reset []
    environment:
      <<: *mobile-environment
      # This worker delivers incidents from every CRCON database partition,
      # not only backend_1. Pass every game profile explicitly so Discord does
      # not label HLL Vietnam incidents as HLL/WW2.
      HLL_GAME: ${HLL_GAME:-hll}
      HLL_GAME_2: ${HLL_GAME_2:-hll}
      HLL_GAME_3: ${HLL_GAME_3:-hll}
      HLL_GAME_4: ${HLL_GAME_4:-hll}
      HLL_SERVER_NAME: ${HLL_SERVER_NAME:-CRCON Server 1}
      HLL_SERVER_NAME_2: ${HLL_SERVER_NAME_2:-CRCON Server 2}
      HLL_SERVER_NAME_3: ${HLL_SERVER_NAME_3:-CRCON Server 3}
      HLL_SERVER_NAME_4: ${HLL_SERVER_NAME_4:-CRCON Server 4}

  discord_moderation_worker:
    # AI requests can take several seconds. Keep them in a separate process so
    # they can never delay time-sensitive admin reports and interaction edits.
    extends:
      file: compose.yaml
      service: backend_1
    <<: *frontline-backend
    command: discord_moderation_worker
    networks:
      server1:
        aliases: !reset []
    environment:
      <<: *mobile-environment
      HLL_GAME: ${HLL_GAME:-hll}
      HLL_GAME_2: ${HLL_GAME_2:-hll}
      HLL_GAME_3: ${HLL_GAME_3:-hll}
      HLL_GAME_4: ${HLL_GAME_4:-hll}
      HLL_SERVER_NAME: ${HLL_SERVER_NAME:-CRCON Server 1}
      HLL_SERVER_NAME_2: ${HLL_SERVER_NAME_2:-CRCON Server 2}
      HLL_SERVER_NAME_3: ${HLL_SERVER_NAME_3:-CRCON Server 3}
      HLL_SERVER_NAME_4: ${HLL_SERVER_NAME_4:-CRCON Server 4}

  frontline_background_worker:
    # Opt-in replacement for the three standalone delivery workers. Each loop
    # keeps its own thread/session so slow AI calls cannot block reports or push.
    profiles: ["combined-workers"]
    extends:
      file: compose.yaml
      service: backend_1
    <<: *frontline-backend
    command: frontline_background_worker
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -f 'manage.py frontline_background_worker' >/dev/null",
        ]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      server1:
        aliases: !reset []
    environment:
      <<: *mobile-environment
      HLL_GAME: ${HLL_GAME:-hll}
      HLL_GAME_2: ${HLL_GAME_2:-hll}
      HLL_GAME_3: ${HLL_GAME_3:-hll}
      HLL_GAME_4: ${HLL_GAME_4:-hll}
      HLL_SERVER_NAME: ${HLL_SERVER_NAME:-CRCON Server 1}
      HLL_SERVER_NAME_2: ${HLL_SERVER_NAME_2:-CRCON Server 2}
      HLL_SERVER_NAME_3: ${HLL_SERVER_NAME_3:-CRCON Server 3}
      HLL_SERVER_NAME_4: ${HLL_SERVER_NAME_4:-CRCON Server 4}

  backend_1:
    <<: *frontline-backend
    environment: *mobile-environment

  supervisor_1:
    <<: *frontline-backend
    environment: *mobile-environment

  backend_2:
    <<: *frontline-backend
    environment: *mobile-environment-server-2

  supervisor_2:
    <<: *frontline-backend
    environment: *mobile-environment-server-2

  backend_3:
    <<: *frontline-backend
    environment: *mobile-environment-server-3

  supervisor_3:
    <<: *frontline-backend
    environment: *mobile-environment-server-3

  backend_4:
    <<: *frontline-backend
    environment: *mobile-environment-server-4

  supervisor_4:
    <<: *frontline-backend
    environment: *mobile-environment-server-4

  frontend_1:
    <<: *frontline-frontend

  frontend_2:
    <<: *frontline-frontend

  frontend_3:
    <<: *frontline-frontend

  frontend_4:
    <<: *frontline-frontend
