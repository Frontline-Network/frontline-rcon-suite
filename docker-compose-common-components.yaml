services:
  # These containers are created only once regardless of the number of game servers
  # that you run inside of CRCON
  redis:
    image: ${REDIS_IMAGE}
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 15s
      timeout: 30s
      retries: 5
    volumes:
      - ./redis_data:/data
      - ./config:/usr/local/etc/redis
    networks:
      - common
  postgres:
    image: ${POSTGRES_IMAGE}
    # Increases the default 100 to 300
    command: postgres -c max_connections=300
    environment:
      # If a password is not defined this container will fail to create
      POSTGRES_PASSWORD: ${HLL_DB_PASSWORD}
      POSTGRES_USER: ${HLL_DB_USER}
      POSTGRES_DB: ${HLL_DB_NAME}
      PGDATA: /data
      HLL_DB_NAME: ${HLL_DB_NAME}
      HLL_DB_USER: ${HLL_DB_USER}
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${HLL_DB_USER}", "-d", "${HLL_DB_NAME}" ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 80s
    volumes:
      - ./db_data:/data
    networks:
      - common
  # This container is used for things that should only run once regardless of
  # the number of game servers used, for instance database migrations
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CRCON_VERSION: ${TAGGED_VERSION:-unknown}
    image: ${BACKEND_DOCKER_REPOSITORY}:${TAGGED_VERSION}
    environment:
      CRCON_VERSION: ${TAGGED_VERSION:-unknown}
      HLL_MAINTENANCE_CONTAINER: true
      HLL_DB_USER: ${HLL_DB_USER}
      HLL_DB_PASSWORD: ${HLL_DB_PASSWORD}
      HLL_DB_NAME: ${HLL_DB_NAME}
      HLL_DB_HOST: ${HLL_DB_HOST}
      HLL_DB_HOST_PORT: ${HLL_DB_HOST_PORT}
      HLL_DB_URL: postgresql://${HLL_DB_USER}:${HLL_DB_PASSWORD}@${HLL_DB_HOST}:${HLL_DB_HOST_PORT}/${HLL_DB_NAME}
      HLL_REDIS_URL: redis://${HLL_REDIS_HOST}:${HLL_REDIS_HOST_PORT}/${HLL_REDIS_DB}
    command: maintenance
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "test -f /code/rconweb/maintenance-container-healthy" ]
      start_period: 30s
      interval: 15s
      timeout: 30s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/logs/
    networks:
      - common
  # This is used to handle webhooks to discord (and other services in the future)
  webhook_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CRCON_VERSION: ${TAGGED_VERSION:-unknown}
    image: ${BACKEND_DOCKER_REPOSITORY}:${TAGGED_VERSION}
    environment:
      CRCON_VERSION: ${TAGGED_VERSION:-unknown}
      HLL_WH_SERVICE_CONTAINER: true
      LOGGING_LEVEL: "INFO"
      LOGGING_PATH: /logs/
      CONFIG_DIR: /config/
      HLL_REDIS_HOST: ${HLL_REDIS_HOST}
      HLL_REDIS_PORT: ${HLL_REDIS_HOST_PORT}
      HLL_DB_USER: ${HLL_DB_USER}
      HLL_DB_PASSWORD: ${HLL_DB_PASSWORD}
      HLL_DB_NAME: ${HLL_DB_NAME}
      HLL_DB_HOST: ${HLL_DB_HOST}
      HLL_DB_HOST_PORT: ${HLL_DB_HOST_PORT}
      HLL_DB_URL: postgresql://${HLL_DB_USER}:${HLL_DB_PASSWORD}@${HLL_DB_HOST}:${HLL_DB_HOST_PORT}/${HLL_DB_NAME}
      # The local rate window limit parameters
      HLL_WH_SERVICE_RL_RESET_SECS: ${HLL_WH_SERVICE_RL_RESET_SECS}
      HLL_WH_SERVICE_RL_REQUESTS_PER: ${HLL_WH_SERVICE_RL_REQUESTS_PER}
      HLL_WH_SERVICE_RL_TIME_WINDOW: ${HLL_WH_SERVICE_RL_TIME_WINDOW}
      HLL_WH_MAX_QUEUE_LENGTH: ${HLL_WH_MAX_QUEUE_LENGTH}
      HLL_WH_LOOP_SLEEP_TIME: ${HLL_WH_LOOP_SLEEP_TIME}
    command: webhook_service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "if [ -e /code/webhook-service-healthy ]; then echo 0; else echo 1; fi" ]
      start_period: 30s
      interval: 15s
      timeout: 30s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/logs/
    networks:
      - common
    # This is not a CPU intensive container; but
    deploy:
      resources:
        limits:
          cpus: '1.0'
  mobile_push_worker:
    profiles: ["mobile"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CRCON_VERSION: ${TAGGED_VERSION:-unknown}
    image: ${BACKEND_DOCKER_REPOSITORY}:${TAGGED_VERSION}
    command: mobile_push_worker
    restart: unless-stopped
    environment:
      CRCON_VERSION: ${TAGGED_VERSION:-unknown}
      SERVER_NUMBER: 1
      LOGGING_PATH: /logs/
      HLL_DB_USER: ${HLL_DB_USER}
      HLL_DB_PASSWORD: ${HLL_DB_PASSWORD}
      HLL_DB_NAME: ${HLL_DB_NAME}
      HLL_DB_HOST: ${HLL_DB_HOST}
      HLL_DB_HOST_PORT: ${HLL_DB_HOST_PORT}
      HLL_DB_URL: postgresql://${HLL_DB_USER}:${HLL_DB_PASSWORD}@${HLL_DB_HOST}:${HLL_DB_HOST_PORT}/${HLL_DB_NAME}
      HLL_REDIS_URL: redis://${HLL_REDIS_HOST}:${HLL_REDIS_HOST_PORT}/0
      RCONWEB_API_SECRET: ${RCONWEB_API_SECRET}
      MOBILE_INTEGRATION_ENABLED: ${MOBILE_INTEGRATION_ENABLED}
      MOBILE_PUBLIC_BASE_URL: ${MOBILE_PUBLIC_BASE_URL}
      DISCORD_CALLBACK_BASE_URL: ${DISCORD_CALLBACK_BASE_URL:-}
      MOBILE_INSTALLATION_ID: ${MOBILE_INSTALLATION_ID}
      MOBILE_PUSH_RELAY_URL: ${MOBILE_PUSH_RELAY_URL}
    depends_on:
      maintenance:
        condition: service_healthy
    volumes:
      - ./logs:/logs/
    networks:
      - common
  discord_report_worker:
    profiles: ["discord"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CRCON_VERSION: ${TAGGED_VERSION:-unknown}
    image: ${BACKEND_DOCKER_REPOSITORY}:${TAGGED_VERSION}
    command: discord_report_worker
    restart: unless-stopped
    environment:
      CRCON_VERSION: ${TAGGED_VERSION:-unknown}
      SERVER_NUMBER: 1
      LOGGING_PATH: /logs/
      HLL_DB_USER: ${HLL_DB_USER}
      HLL_DB_PASSWORD: ${HLL_DB_PASSWORD}
      HLL_DB_NAME: ${HLL_DB_NAME}
      HLL_DB_HOST: ${HLL_DB_HOST}
      HLL_DB_HOST_PORT: ${HLL_DB_HOST_PORT}
      HLL_DB_URL: postgresql://${HLL_DB_USER}:${HLL_DB_PASSWORD}@${HLL_DB_HOST}:${HLL_DB_HOST_PORT}/${HLL_DB_NAME}
      HLL_REDIS_URL: redis://${HLL_REDIS_HOST}:${HLL_REDIS_HOST_PORT}/0
      RCONWEB_API_SECRET: ${RCONWEB_API_SECRET}
      DISCORD_REPORTS_ENABLED: ${DISCORD_REPORTS_ENABLED}
      DISCORD_SERVICE_URL: ${DISCORD_SERVICE_URL}
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED}
    depends_on:
      maintenance:
        condition: service_healthy
    volumes:
      - ./logs:/logs/
    networks:
      - common
