[project]
name = "crcon-push-relay"
version = "0.1.0"
description = "Privacy-minimal FCM/APNs relay for CRCON Mobile Admin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.41,<3",
  "pydantic-settings>=2.10,<3",
  "firebase-admin>=7,<8",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
